apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backend
  labels: {{- include "ea.labels" . | nindent 4 }}
data:
  DB_URL: "jdbc:postgresql://{{ include "ea.pgHost" . }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
  DB_USERNAME: {{ .Values.postgres.username | quote }}
  REDIS_HOST: "{{ .Release.Name }}-redis"
  AI_BASE_URL: "http://{{ .Release.Name }}-ai-server:8000"
  STORAGE_TYPE: "s3"
  S3_BUCKET: {{ .Values.s3.bucket | quote }}
  AWS_REGION: {{ .Values.s3.region | quote }}
  {{- if .Values.s3.internal.enabled }}
  S3_ENDPOINT: "http://{{ .Release.Name }}-s3:9090"
  S3_PATH_STYLE: "true"
  S3_ACCESS_KEY: "local"
  S3_SECRET_KEY: "local-secret"
  {{- end }}
  APP_SEED_DEMO_USERS: {{ .Values.config.seedDemoUsers | quote }}
  APP_JWT_TTL_MINUTES: {{ .Values.config.jwtTtlMinutes | quote }}
  UNIVERSITY_API_URL: {{ .Values.config.universityApiUrl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-ai-server
  labels: {{- include "ea.labels" . | nindent 4 }}
data:
  QDRANT_URL: "http://{{ .Release.Name }}-qdrant:6333"
  DECISION_PROVIDER: {{ .Values.config.decisionProvider | quote }}
  JEV_BASE_URL: {{ .Values.config.jevBaseUrl | quote }}
  JEV_MODEL: {{ .Values.config.jevModel | quote }}
  OPENAI_CHAT_MODEL: {{ .Values.config.openaiChatModel | quote }}
