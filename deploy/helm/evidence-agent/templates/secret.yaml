{{- if .Values.secrets.create }}
{{- /* 비워 둔 값은 처음 설치할 때 무작위로 만들고, 업그레이드 때는 기존 값을 유지한다 */ -}}
{{- $name := printf "%s-secrets" .Release.Name }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "ea.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secrets.values }}
  {{- if $v }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- else if hasKey $existing $k }}
  {{ $k }}: {{ index $existing $k | quote }}
  {{- else if has $k (list "APP_JWT_SECRET" "AI_INTERNAL_TOKEN" "DB_PASSWORD") }}
  {{ $k }}: {{ randAlphaNum 48 | b64enc | quote }}
  {{- else }}
  {{ $k }}: ""
  {{- end }}
  {{- end }}
{{- end }}
